
### Gemini cleansed & Saninitized ##

# ====================================================================
# PRINT LIFECYCLE MACROS
# ====================================================================

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    SKEW_PROFILE LOAD=my_skew_profile
    
    # Pre-heat bed and ramp up hotend
    M117 Heating bed to {BED_TEMP}C...
    M140 S{BED_TEMP}
    M104 S150           			#### pre heat hotend to save burning filament
   	# M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}

    # Homing and Adaptive Leveling
    M117 Homing and Leveling...
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=2

    # Final Hotend Heating and Parking
    M117 Heating hotend to {EXTRUDER_TEMP}C...
    SMART_PARK
    M109 S{EXTRUDER_TEMP}
    
    # State Reset
    M83
    M220 S100
    M221 S100
    G92 E0
    M107
    
    # Adaptive Purge
    M117 Purging...
    LINE_PURGE
    G91
    G1 Z2 F3000
    G90
    G92 E0

    M117 Printing...


[gcode_macro END_PRINT]
gcode:
    {% set max_layer_z = params.MAX_LAYER_Z|default(0)|float %}
    {% set printable_height = params.PRINTABLE_HEIGHT|default(250)|float %}
    {% set z_offset = params.Z_OFFSET|default(0)|float %}
    {% set travel_speed = (params.TRAVEL_SPEED|default(120)|float) * 0.6 %}
    {% set bed_max_y = params.BED_MAX_Y|default(220)|float %}
    
    # Z-Lifts and Present Print
    {% if max_layer_z < printable_height %}
        {% set lift_z = [max_layer_z + 2.0, printable_height]|min %}
        G1 Z{z_offset + lift_z} F600
    {% endif %}

    G1 X5 Y{bed_max_y * 0.8} F{travel_speed * 60}

    {% if max_layer_z < (printable_height - 10.0) %}
        {% set lift_z2 = [max_layer_z + 70.0, printable_height - 10.0]|min %}
        G1 Z{z_offset + lift_z2} F600
    {% endif %}

    {% if max_layer_z < (printable_height * 0.6) %}
        G1 Z{printable_height * 0.3} F600
    {% endif %}

    # Shutdown Sequence
    DISABLE_MOTORS
    M140 S0
    M104 S0
    M107
    POWER_OFF_PRINTER
    M117 Print Complete!


[gcode_macro CANCEL_PRINT]
description: Safely cancels the active print and resets printer state
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set x_park = 10.0 %}                  ; Safe left-side parking position
    {% set y_park = 200.0 %}                 ; Safe rear parking position
    {% set z_lift = 10.0 %}                  ; Amount to lift Z axis
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    # Calculate safe Z lift clearance
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # Turn off heaters & fans
    M104 S0
    M140 S0
    M106 S0

    # Retract and Lift
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91
        G1 E-2.0 F2100                       ; Retract 2mm to prevent ooze
        G1 Z{z_safe} F900                    ; Lift nozzle
        G90
        G1 X{x_park} Y{y_park} F6000         ; Move to safe corner
    {% else %}
        M117 Axis not homed, skipping lift...
    {% endif %}

    # Clear mesh & state resets
    BED_MESH_CLEAR
    M220 S100
    M221 S100
    M83
    
    BASE_CANCEL_PRINT
    M117 Print Cancelled!


# ====================================================================
# PAUSE, RESUME & SLEEP CONTROL
# ====================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set x_park = 10.0 %}
    {% set y_park = 200.0 %}
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    {% if act_z < (max_z - z_lift) %}
        {% set z_safe = z_lift %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 E-1.0 F2100
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1.0 F2100
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME


[gcode_macro PARK_AND_SLEEP]
gcode:
    {% if printer.pause_resume.is_paused %}
        M117 Already paused. Sleeping heaters...
    {% else %}
        M117 Pausing print for sleep...
        PAUSE
    {% endif %}
    
    M104 S0
    M140 S0
    M106 S0
    M117 Printer asleep. Keep power ON!


[gcode_macro WAKE_AND_RESUME]
gcode:
    {% set target_extruder = printer.pause_resume.target_extruder|default(200)|float %}
    {% set target_bed = printer.pause_resume.target_bed|default(60)|float %}
    
    {% if printer.pause_resume.is_paused %}
        M117 Heating up for resume...
        M140 S{target_bed}
        M104 S{target_extruder}
        M190 S{target_bed}
        M109 S{target_extruder}
        M117 Resuming print...
        RESUME
    {% else %}
        M117 No active paused print to resume!
    {% endif %}


# ====================================================================
# MAINTENANCE & UTILITY MACROS
# ====================================================================

[gcode_macro CLEAN_NOZZLE]
description: Wipes nozzle back and forth across a predefined area
gcode:
    {% set wipe_count = 8 %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90
    G0 Z15 F300
    {% for wipe in range(wipe_count) %}
        {% for coordinate in [200, 240] %}
            G0 X{coordinate} Y{4 + 0.25 * wipe} Z9.7 F12000
        {% endfor %}
    {% endfor %}
    RESTORE_GCODE_STATE NAME=clean_nozzle_state


[gcode_macro HEAT_BED_55]
description: Preheats bed to 55C and hotend to standby 140C
gcode:
    M140 S55
    M104 S140


[gcode_macro DISABLE_MOTORS]
description: Safely disables all stepper motors
gcode:
    M84 X Y Z E
    M117 Motors Disabled...


[gcode_macro FORCE_RAISE_Z]
description: Force-moves the Z stepper up 20mm
gcode:
    M400
    FORCE_MOVE STEPPER=stepper_z DISTANCE=20 VELOCITY=5


# ====================================================================
# FILAMENT UTILITIES
# ====================================================================

[gcode_macro LOAD_FILAMENT]
gcode:
   M104 S190
   M109 S190
   G91
   G1 E400 F2000
   G1 E30 F200
   G90


[gcode_macro UNLOAD_FILAMENT]
gcode:
   M104 S190
   M109 S190
   G91
   G1 E5 F300
   G1 E-380 F4000
   G90


# ====================================================================
# BLTOUCH TESTING & OVERRIDES
# ====================================================================

[gcode_macro BLTOUCH_RESET]
gcode:
    BLTOUCH_DEBUG COMMAND=reset


[gcode_macro BLTOUCH_PIN_UP]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_up


[gcode_macro BLTOUCH_PIN_DOWN]
gcode:
    BLTOUCH_DEBUG COMMAND=pin_down


[gcode_macro BLTOUCH_TEST]
gcode:
    BLTOUCH_DEBUG COMMAND=touch_mode
    QUERY_PROBE


