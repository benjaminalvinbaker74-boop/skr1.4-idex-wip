# ====================================================================
# PRINTER & MCU CONFIGURATION
# ====================================================================

[mcu]
serial: /dev/ttyAMA0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 100 # Capped for noise
max_accel: 3000
max_z_velocity: 20
max_z_accel: 100
minimum_cruise_ratio: 0.5
square_corner_velocity: 5

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]
[pause_resume]
[exclude_object]
[endstop_phase]

[force_move]
enable_force_move: True

[exclude_object]

[respond]
default_type: echo

[input_shaper]
shaper_freq_x: 38.81
shaper_freq_y: 60
shaper_type: 2hump_ei

# ====================================================================
# STEPPER MOTORS & DRIVERS
# ====================================================================

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 39.69
endstop_pin: ^!P1.29
position_endstop: -17 	#was -10
position_min: -17		#was -10
position_max: 260
homing_speed: 20

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.650
stealthchop_threshold: 999999
interpolate: True
sense_resistor: 0.110

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 39.92
endstop_pin: ^!P1.28
position_endstop: -4 	## was 0
position_min: -4
position_max: 260
homing_speed: 20

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.650
stealthchop_threshold: 999999
interpolate: True
sense_resistor: 0.110

[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
position_min: -25
position_max: 250
endstop_pin: probe:z_virtual_endstop
#endstop_pin: !P1.25 ######  this just for debug
#position_endstop: 0 ####
homing_speed: 5.0
homing_retract_dist: 4.0
homing_retract_speed: 5.0
second_homing_speed: 2.0

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.650
stealthchop_threshold: 999999
interpolate: True
sense_resistor: 0.110

# ====================================================================
# EXTRUDER & HEATER BED
# ====================================================================

[extruder]
step_pin: EBB:PD3
dir_pin: !EBB:PD2
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 21.740
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB0
#sensor_type: EPCOS 100K B57560G104F   ###### not this one 
sensor_type: ATC Semitec 104NT-4-R025H42G   ## triangle labs ?
#sensor_type: ATC Semitec 104GT-2
#sensor_type: Trianglelab T-D500       #### high temp ??

smooth_time: 2.0  # Increases temperature reading averaging (default is 1.0)

pullup_resistor: 2200
sensor_pin: EBB:PA1

control: pid
pid_kp: 25.133
pid_ki: 1.727
pid_kd: 91.417

min_temp: 0
max_temp: 280
max_extrude_cross_section: 5.0
max_extrude_only_velocity: 45
max_extrude_only_accel: 1200
pressure_advance: 0.6
pressure_advance_smooth_time: 0.06
max_extrude_only_distance: 200.0
min_extrude_temp: 0

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.45
stealthchop_threshold: 10
interpolate: True
sense_resistor: 0.110

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
control: pid
pid_kp: 72.830
pid_ki: 2.207
pid_kd: 600.844
min_temp: 0
max_temp: 130

# ====================================================================
# PROBING & BED LEVELING
# ====================================================================

[bltouch]
sensor_pin: ^!EBB:PA5
control_pin: EBB:PA4
pin_move_time: 0.680
x_offset: 40 			#-37 was
y_offset: 0				#2  was
#z_offset: 2.400
samples: 3
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
sample_retract_dist: 4.0
pin_up_reports_not_triggered: False
probe_with_touch_mode: False
speed: 3.0
lift_speed: 5
stow_on_each_sample: True
pin_up_touch_mode_reports_triggered: True

[safe_z_home]
home_xy_position: 2,44 			# 82, 44  old tool head
speed: 30
z_hop: 4
z_hop_speed: 4

[bed_mesh]
speed: 30
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 195, 215
probe_count: 4, 4
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 5
split_delta_z: 0.05
fade_start: 1.0
fade_end: 10.0
fade_target: 0
horizontal_move_z: 8 ####

[bed_screws]
screw1: 2,44 						#82, 44
screw2: 170,44						#252, 44
screw3: 170,214						#252, 212
screw4: 2,214						#82, 212

[screws_tilt_adjust]
screw1: 2,44 						# 82, 44
screw1_name: front left screw
screw2: 170,44						#252, 44
screw2_name: front right screw
screw3: 170,214						#252, 212
screw3_name: rear right screw
screw4: 2,214						#82, 212
screw4_name: rear left screw
horizontal_move_z: 10.
speed: 50.
screw_thread: CW-M3

# ====================================================================
# PIN ALIASES
# ====================================================================

[board_pins]
aliases:
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>

# ====================================================================
# INCLUDES
# ====================================================================

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include bigtreetech-ebb42-gen2.cfg]
[include macros.cfg]

